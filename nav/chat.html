<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/CSS/icons.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/20251102_172020.png" sizes="32x32"/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/chat.css" />
  <link rel="stylesheet" href="/CSS/skeletons.css" />
  <title>Messages — Sweet Feet</title>
  <style>
    :root {
      --clr-bg: #fdfaf6;
      --clr-dark: #160c02;
      --clr-accent: #c8440c;
      --clr-muted: #7a6555;
      --clr-surface: #fff;
      --clr-border: #e8ddd4;
      --clr-tag-bg: #f3ede8;
      --clr-cream: #f7dfb8;
      --ff-display: "Work Sans", sans-serif;
      --ff-ui: "Kumbh Sans", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 62.5%; }
    body {
      margin: 0;
      font-family: var(--ff-ui);
      background: var(--clr-bg);
      color: var(--clr-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::-webkit-scrollbar { display: none; }
    .site_header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1rem 2rem;
      background: var(--clr-dark);
      color: var(--clr-cream);
      flex-shrink: 0;
    }
    .site_header .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--clr-cream);
      font-family: var(--ff-display);
      font-weight: 800;
      font-size: 1.5rem;
    }
    .site_header .logo img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .site_header nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.25rem;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .site_header nav a {
      color: var(--clr-cream);
      text-decoration: none;
    }
    .site_header nav a:hover,
    .site_header nav a.active { color: #efbc8a; }
    .chat_page_wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chat_page_wrap .chat_layout {
      height: calc(100vh - 64px);
      width: 100%;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="site_header">
    <a class="logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <nav class="nav auth_nav_slot">
      <a href="/nav/signup.html">Sign Up</a>
      <a href="/nav/login.html">Login</a>
      <a href="/nav/products.html">Shop</a>
      <a href="/nav/track.html">Track</a>
      <a href="/nav/chat.html" class="active">Messages</a>
      <a href="/nav/feedback.html">Feedback</a>
    </nav>
  </header>

  <div class="chat_page_wrap">
    <div class="chat_layout">
      <div class="chat_inbox" id="inboxList">
        <div class="inbox_search">
          <input type="text" id="inboxSearch" placeholder="Search conversations…" />
        </div>
        <div id="inboxItems">
          <div class="sk-inbox" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk-col"><div class="sk sk-line sk-w-55"></div><div class="sk sk-line sk-w-80"></div></div></div>
          <div class="sk-inbox" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk-col"><div class="sk sk-line sk-w-40"></div><div class="sk sk-line sk-w-70"></div></div></div>
          <div class="sk-inbox" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk-col"><div class="sk sk-line sk-w-55"></div><div class="sk sk-line sk-w-80"></div></div></div>
          <div class="sk-inbox" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk-col"><div class="sk sk-line sk-w-40"></div><div class="sk sk-line sk-w-70"></div></div></div>
          <div class="sk-inbox" aria-hidden="true"><div class="sk sk-circle"></div><div class="sk-col"><div class="sk sk-line sk-w-55"></div><div class="sk sk-line sk-w-80"></div></div></div>
        </div>
      </div>

      <div class="chat_panel" id="chatPanel">
        <div class="chat_empty_state" id="chatEmptyState">
          <div style="font-size:3rem;margin-bottom:1rem"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg></div>
          <p>Select a conversation</p>
          <p style="margin-top:1rem;font-size:1.15rem">
            Browse the <a href="/nav/products.html" style="color:var(--clr-accent);font-weight:700">shop</a> and message a seller from a product card.
          </p>
        </div>
        <div class="chat_header hidden" id="chatHeader">
          <div class="chat_avatar" id="chatAvatar"></div>
          <div>
            <div class="chat_partner_name" id="chatPartnerName"></div>
            <div class="chat_partner_sub" id="chatPartnerSub"></div>
          </div>
        </div>
        <div class="chat_messages hidden" id="chatMessages"></div>
        <div class="chat_input_bar hidden" id="chatInputBar">
          <textarea id="chatInput" placeholder="Type a message…" rows="1"></textarea>
          <button type="button" id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
