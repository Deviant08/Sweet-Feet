<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed — Sweet Feet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700;800&family=Kumbh+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Kumbh Sans', sans-serif;
      background: #fdfaf6;
      color: #160c02;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      font-size: 3rem;
      width: 8rem; height: 8rem;
      background: #fdf0f0;
      border: 2px solid #f5a8a8;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      color: #c0392b;
    }
    h1 {
      font-family: 'Work Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 1rem;
    }
    p { font-size: 1rem; color: #7a6555; line-height: 1.6; max-width: 420px; margin: 0 auto .5rem; }
    .buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2.5rem; }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #160c02;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-family: 'Work Sans', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      transition: background .2s;
    }
    .btn:hover { background: #c8440c; }
    .btn.outline {
      background: none;
      border: 2px solid #160c02;
      color: #160c02;
    }
    .btn.outline:hover { background: #160c02; color: #fff; }
  </style>
</head>
<body>
  <div class="icon">✕</div>
  <h1>Payment Unsuccessful</h1>
  <p>Your payment could not be completed. Your card has not been charged.</p>
  <p>This may be due to insufficient funds, a network issue, or the payment was cancelled.</p>
  <div class="buttons">
    <a href="/sweetfeet/nav/products.html" class="btn">Try Again →</a>
    <a href="/sweetfeet/index.html" class="btn outline">Go Home</a>
  </div>
</body>
</html>
