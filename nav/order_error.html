<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/20251102_172020.png" sizes="32x32"/>
  <title>Payment Failed — Sweet Feet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700;800&family=Kumbh+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    a, a:link, a:visited { text-decoration: none; }
    body {
      font-family: 'Kumbh Sans', sans-serif;
      background: #fdfaf6;
      color: #160c02;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    body::-webkit-scrollbar {
  display: none;
}
    .card {
      background: #fff;
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 28rem;
      box-shadow: 0 8px 32px rgba(22,12,2,0.08);
      border: 1px solid rgba(22,12,2,0.06);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-family: 'Work Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; }
    p { font-size: 0.95rem; color: #695d49; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #160c02;
      color: #f7dfb8;
      padding: 0.85rem 1.75rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s;
      margin: 0.25rem;
    }
    .btn:hover { transform: scale(1.03); }
    .btn.outline { background: transparent; color: #160c02; border: 2px solid #160c02; }
    .logo {
      display: flex; align-items: center; gap: 0.6rem; justify-content: center;
      margin-bottom: 1.5rem; color: #160c02; font-weight: 700; font-size: 1.1rem;
    }
    .logo img {
      width: 2.5rem; height: 2.5rem; border-radius: 50%; object-fit: cover;
      border: 1px ridge #d5b074e5;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      Sweet Feet
    </a>
    <div class="icon">❌</div>
    <h1>Payment failed</h1>
    <p>Something went wrong with your payment. No charge was made. Please try again or contact support.</p>
    <a class="btn" href="/nav/products.html">Back to shop →</a>
    <a class="btn outline" href="/nav/chat.html">Contact support</a>
  </div>
</body>
</html>
