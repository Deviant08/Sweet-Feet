<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <title>Retailers — Sweet Feet Admin</title>
</head>
<body>

<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Admin</span>
    <a class="sidebar_link" href="/admin/dashboard.html"><span class="icon">📊</span> Overview</a>
    <a class="sidebar_link active" href="/admin/retailers.html"><span class="icon">🏪</span> Retailers</a>
    <div class="sidebar_divider"></div>
    <a class="sidebar_link" href="#" id="logoutBtn"><span class="icon">🚪</span> Log Out</a>
  </nav>

  <div class="main_content">
    <div class="page_header">
      <div>
        <h1>Retailers</h1>
        <p>Approve or suspend marketplace sellers.</p>
      </div>
    </div>

    <div class="page_body">
      <div class="table_wrap">
        <table>
          <thead>
            <tr>
              <th>Business</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="retailersBody">
            <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--clr-muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal_overlay open" id="loginModal">
  <div class="modal">
    <h3>Admin Login</h3>
    <div class="form_group" style="margin-top:2rem">
      <label>Email</label>
      <input type="email" id="adminEmail" />
    </div>
    <div class="form_group">
      <label>Password</label>
      <input type="password" id="adminPassword" />
    </div>
    <div class="msg_error" id="loginError"></div>
    <div class="modal_footer">
      <button class="btn_sm dark" id="adminLoginBtn" style="width:100%">Log In →</button>
    </div>
  </div>
</div>

<script type="module">
import { api, setSession, clearSession, getToken } from "/js/api.js";

document.getElementById("adminLoginBtn").addEventListener("click", async () => {
  const errorEl = document.getElementById("loginError");
  const btn = document.getElementById("adminLoginBtn");
  errorEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        email: document.getElementById("adminEmail").value.trim(),
        password: document.getElementById("adminPassword").value,
      },
    });
    setSession(data.token, data.data, "user");
    document.getElementById("loginModal").classList.remove("open");
    loadRetailers();
  } catch (e) {
    errorEl.textContent = e.message || "Login failed";
    errorEl.style.display = "block";
  }
  btn.disabled = false;
  btn.textContent = "Log In →";
});

async function loadRetailers() {
  if (!getToken()) {
    document.getElementById("loginModal").classList.add("open");
    return;
  }
  const tbody = document.getElementById("retailersBody");
  try {
    const json = await api("/retailers");
    const list = json.data || [];
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--clr-muted)">No retailers yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = list
      .map((r) => {
        const id = r._id || r.id;
        return `<tr>
        <td>${r.businessName || "—"}</td>
        <td>${r.email || ""}</td>
        <td>${r.phone || ""}</td>
        <td>${r.location || ""}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
        <td>
          ${r.status !== "approved" ? `<button class="btn_sm dark" data-id="${id}" data-status="approved">Approve</button>` : ""}
          ${r.status !== "suspended" ? `<button class="btn_sm danger" data-id="${id}" data-status="suspended">Suspend</button>` : ""}
        </td>
      </tr>`;
      })
      .join("");

    tbody.querySelectorAll("[data-status]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await api(`/retailers/${btn.dataset.id}/status`, {
            method: "PATCH",
            body: { status: btn.dataset.status },
          });
          loadRetailers();
        } catch (e) {
          alert(e.message || "Update failed");
        }
      });
    });
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6">${e.message || "Failed to load"}</td></tr>`;
    document.getElementById("loginModal").classList.add("open");
  }
}

document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  try {
    await api("/auth/logout", { method: "POST" });
  } catch {
    /* ignore */
  }
  clearSession();
  window.location.reload();
});

loadRetailers();
</script>
</body>
</html>
