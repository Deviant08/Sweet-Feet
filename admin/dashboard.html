<script type="module">
import { api, setSession, clearSession, getToken, confirmAndLogout } from "/js/api.js";
const tbody = document.getElementById("ordersBody");
async function requireAdmin() {
  if (!getToken()) { window.location.replace("/nav/login.html?role=admin"); return false; }
  try {
    const me = await api("/auth/me");
    if (me.data?.role !== "admin") { clearSession(); window.location.replace("/nav/login.html?role=admin"); return false; }
    return true;
  } catch { clearSession(); window.location.replace("/nav/login.html?role=admin"); return false; }
}
async function loadRetailerList() {
  let json;
  try { json = await api("/retailers/admin/all"); } catch { json = await api("/retailers"); }
  let list = Array.isArray(json.data) ? json.data : [];
  if (!list.length) {
    try {
      await api("/seed/accounts", { method: "POST" });
      await api("/seed/demo", { method: "POST" });
      json = await api("/retailers/admin/all").catch(() => api("/retailers"));
      list = Array.isArray(json.data) ? json.data : [];
    } catch {}
  }
  return list;
}
async function loadDashboard() {
  const ok = await requireAdmin(); if (!ok) return;
  try {
    const [retailers, prods] = await Promise.all([loadRetailerList(), api("/products").then((j) => j.data || []).catch(() => [])]);
    const pending = retailers.filter((r) => r.status === "pending").length;
    const approved = retailers.filter((r) => r.status === "approved").length;
    const badge = document.getElementById("pendingBadge");
    if (pending > 0) { badge.textContent = pending; badge.style.display = "inline-flex"; } else badge.style.display = "none";
    document.getElementById("statsGrid").innerHTML = `
      <div class="stat_card"><div class="stat_icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z"/></svg></div><div class="stat_value">${approved}</div><div class="stat_label">Approved Retailers</div></div>
      <div class="stat_card"><div class="stat_icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></div><div class="stat_value">${pending}</div><div class="stat_label">Pending Approvals</div></div>
      <div class="stat_card"><div class="stat_icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg></div><div class="stat_value">${prods.length}</div><div class="stat_label">Active Listings</div></div>
      <div class="stat_card"><div class="stat_icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/></svg></div><div class="stat_value">${retailers.length}</div><div class="stat_label">Total Retailers</div></div>`;
    tbody.innerHTML = retailers.length ? retailers.map((r) => `<tr><td><a href="/admin/retailer.html?id=${r._id || r.id}">${r.businessName || "—"}</a></td><td>${r.email || ""}</td><td>${r.location || ""}</td><td><span class="badge ${r.status}">${r.status}</span></td><td><a class="btn_sm outline" href="/admin/retailer.html?id=${r._id || r.id}">Profile</a></td></tr>`).join("") : `<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--clr-muted)">No retailers yet.</td></tr>`;
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:3rem">${err.message || "Failed to load retailers"}</td></tr>`;
  }
}
document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  await confirmAndLogout("/nav/login.html?role=admin");
});
loadDashboard();
</script>
