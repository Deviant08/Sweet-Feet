<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/20251102_172020.png" sizes="32x32"/>
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <link rel="stylesheet" href="/CSS/skeletons.css" />
  <title>Admin Dashboard — Sweet Feet</title>
</head>
<body>
<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Admin</span>
    <a class="sidebar_link active" href="/admin/dashboard.html"><span class="icon">📊</span> Overview</a>
    <a class="sidebar_link" href="/admin/retailers.html"><span class="icon">🏪</span> Retailers <span class="badge pending" id="pendingBadge" style="margin-left:auto;display:none"></span></a>
    <a class="sidebar_link" href="/admin/chat.html"><span class="icon">💬</span> Support Chat</a>
    <div class="sidebar_divider"></div>
    <a class="sidebar_link" href="/index.html" target="_blank"><span class="icon">🌐</span> View Site</a>
    <a class="sidebar_link" id="logoutBtn" href="/nav/login.html?role=admin">
      <span class="icon">🚪</span> Log Out
    </a>
  </nav>
  <div class="main_content">
    <div class="page_header"><div><h1>Platform Overview</h1><p>Sweet Feet marketplace at a glance.</p></div></div>
    <div class="page_body">
      <div class="stats_grid" id="statsGrid">
        <div class="stat_card"><div class="stat_icon">🏪</div><div class="stat_value"><span class="sk sk-stat"></span></div><div class="stat_label">Approved Retailers</div></div>
        <div class="stat_card"><div class="stat_icon">⏳</div><div class="stat_value"><span class="sk sk-stat"></span></div><div class="stat_label">Pending Approvals</div></div>
        <div class="stat_card"><div class="stat_icon">👟</div><div class="stat_value"><span class="sk sk-stat"></span></div><div class="stat_label">Active Listings</div></div>
        <div class="stat_card"><div class="stat_icon">📦</div><div class="stat_value"><span class="sk sk-stat"></span></div><div class="stat_label">Total Retailers</div></div>
      </div>
      <div class="table_wrap">
        <div class="table_header"><h3>Retailers</h3></div>
        <table>
          <thead><tr><th>Business</th><th>Email</th><th>Location</th><th>Status</th><th></th></tr></thead>
          <tbody id="ordersBody">
            <tr class="sk-row"><td><div class="sk sk-w-70"></div></td><td><div class="sk sk-w-80"></div></td><td><div class="sk sk-w-55"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-40"></div></td></tr>
            <tr class="sk-row"><td><div class="sk sk-w-55"></div></td><td><div class="sk sk-w-70"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-30"></div></td></tr>
            <tr class="sk-row"><td><div class="sk sk-w-70"></div></td><td><div class="sk sk-w-80"></div></td><td><div class="sk sk-w-55"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-40"></div></td></tr>
            <tr class="sk-row"><td><div class="sk sk-w-55"></div></td><td><div class="sk sk-w-70"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-40"></div></td><td><div class="sk sk-w-30"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { api, setSession, clearSession, getToken } from "/js/api.js";
const tbody = document.getElementById("ordersBody");
async function requireAdmin() {
  if (!getToken()) { window.location.replace("/nav/login.html?role=admin"); return false; }
  try {
    const me = await api("/auth/me");
    if (me.data?.role !== "admin") { clearSession(); window.location.replace("/nav/login.html?role=admin"); return false; }
    return true;
  } catch { clearSession(); window.location.replace("/nav/login.html?role=admin"); return false; }
}
async function loadRetailerList() {
  let json;
  try { json = await api("/retailers/admin/all"); } catch { json = await api("/retailers"); }
  let list = Array.isArray(json.data) ? json.data : [];
  if (!list.length) {
    try {
      await api("/seed/accounts", { method: "POST" });
      await api("/seed/demo", { method: "POST" });
      json = await api("/retailers/admin/all").catch(() => api("/retailers"));
      list = Array.isArray(json.data) ? json.data : [];
    } catch {}
  }
  return list;
}
async function loadDashboard() {
  const ok = await requireAdmin(); if (!ok) return;
  try {
    const [retailers, prods] = await Promise.all([loadRetailerList(), api("/products").then((j) => j.data || []).catch(() => [])]);
    const pending = retailers.filter((r) => r.status === "pending").length;
    const approved = retailers.filter((r) => r.status === "approved").length;
    const badge = document.getElementById("pendingBadge");
    if (pending > 0) { badge.textContent = pending; badge.style.display = "inline-flex"; } else badge.style.display = "none";
    document.getElementById("statsGrid").innerHTML = `
      <div class="stat_card"><div class="stat_icon">🏪</div><div class="stat_value">${approved}</div><div class="stat_label">Approved Retailers</div></div>
      <div class="stat_card"><div class="stat_icon">⏳</div><div class="stat_value">${pending}</div><div class="stat_label">Pending Approvals</div></div>
      <div class="stat_card"><div class="stat_icon">👟</div><div class="stat_value">${prods.length}</div><div class="stat_label">Active Listings</div></div>
      <div class="stat_card"><div class="stat_icon">📦</div><div class="stat_value">${retailers.length}</div><div class="stat_label">Total Retailers</div></div>`;
    tbody.innerHTML = retailers.length ? retailers.map((r) => `<tr><td>${r.businessName || "—"}</td><td>${r.email || ""}</td><td>${r.location || ""}</td><td><span class="badge ${r.status}">${r.status}</span></td><td><a class="btn_sm outline" href="/admin/retailers.html">Manage</a></td></tr>`).join("") : `<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--clr-muted)">No retailers yet.</td></tr>`;
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:3rem">${err.message || "Failed to load retailers"}</td></tr>`;
  }
}
document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  try { await api("/auth/logout", { method: "POST" }); } catch {}
  clearSession();
  window.location.href = "/nav/login.html?role=admin";
});
loadDashboard();
</script>
<script>
  document.getElementById("logoutBtn").addEventListener("click", function () {
    try {
      ["sf_token","sf_user","sf_retailer","sf_user_id","sf_user_email","sf_user_name"].forEach(function (k) {
        localStorage.removeItem(k);
      });
    } catch (e) {}
  });
</script>
</body></html>
