<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <link rel="stylesheet" href="/CSS/chat.css" />
  <title>Support Chat — Sweet Feet Admin</title>
  <style>
    .chat_layout { display: flex; height: calc(100vh - 0px); background: #faf7f2; }
    .chat_inbox { width: 320px; border-right: 1px solid #e8e0d6; background: #fff; overflow-y: auto; flex-shrink: 0; }
    .inbox_item { display: flex; gap: 0.75rem; padding: 1rem 1.1rem; cursor: pointer; border-bottom: 1px solid #f0ebe3; }
    .inbox_item:hover, .inbox_item.active { background: #f5efe6; }
    .inbox_item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .inbox_meta { flex: 1; min-width: 0; }
    .inbox_name { font-weight: 700; font-size: 1.15rem; }
    .inbox_preview { font-size: 1.05rem; color: #6b5e52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat_thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .thread_header { padding: 1rem 1.25rem; border-bottom: 1px solid #e8e0d6; background: #fff; font-weight: 700; }
    .thread_messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .bubble { max-width: 75%; padding: 0.75rem 1rem; border-radius: 14px; font-size: 1.15rem; line-height: 1.45; }
    .bubble.mine { align-self: flex-end; background: #160c02; color: #f7dfb8; }
    .bubble.theirs { align-self: flex-start; background: #fff; border: 1px solid #e8e0d6; color: #160c02; }
    .bubble time { display: block; font-size: 0.85rem; opacity: 0.7; margin-top: 0.35rem; }
    .thread_compose { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #e8e0d6; background: #fff; }
    .thread_compose input { flex: 1; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid #e8e0d6; font: inherit; }
    .thread_compose button { padding: 0.85rem 1.2rem; border: none; border-radius: 10px; background: #160c02; color: #fff; font-weight: 700; cursor: pointer; }
    .empty_thread { margin: auto; color: #6b5e52; text-align: center; padding: 2rem; }
    .badge_unread { background: #c8440c; color: #fff; font-size: 0.85rem; padding: 0.15rem 0.45rem; border-radius: 999px; }
  </style>
</head>
<body>
<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Admin</span>
    <a class="sidebar_link" href="/admin/dashboard.html"><span class="icon">📊</span> Overview</a>
    <a class="sidebar_link" href="/admin/retailers.html"><span class="icon">🏪</span> Retailers</a>
    <a class="sidebar_link active" href="/admin/chat.html"><span class="icon">💬</span> Support Chat</a>
    <div class="sidebar_divider"></div>
    <a class="sidebar_link" href="#" id="logoutBtn"><span class="icon">🚪</span> Log Out</a>
  </nav>

  <div class="main_content" style="padding:0">
    <div class="chat_layout">
      <div class="chat_inbox" id="inboxList">
        <div style="padding:1rem 1.1rem;font-weight:800;border-bottom:1px solid #e8e0d6">Retailers</div>
        <div id="inboxItems"><div style="padding:2rem;text-align:center;color:#6b5e52">Loading…</div></div>
      </div>
      <div class="chat_thread">
        <div class="thread_header" id="threadTitle">Select a retailer</div>
        <div class="thread_messages" id="threadMessages">
          <div class="empty_thread">Choose a retailer on the left to start chatting.</div>
        </div>
        <form class="thread_compose" id="composeForm" style="display:none">
          <input id="composeInput" type="text" placeholder="Message retailer…" autocomplete="off" required />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal_overlay" id="loginModal">
  <div class="modal">
    <h3>Admin Login</h3>
    <p style="font-size:1.2rem;color:var(--clr-muted);margin:1rem 0 0">admin@sweetfeet.demo / SweetFeet123!</p>
    <form id="adminLoginForm">
      <div class="form_group" style="margin-top:2rem">
        <label>Email</label>
        <input type="email" id="adminEmail" value="admin@sweetfeet.demo" required />
      </div>
      <div class="form_group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="SweetFeet123!" required />
      </div>
      <div class="msg_error" id="loginError"></div>
      <div class="modal_footer">
        <button type="submit" class="btn_sm dark" style="width:100%">Log In →</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { api, setSession, clearSession, getToken, avatarUrl } from "/js/api.js";

const modal = document.getElementById("loginModal");
let activeRetailerId = null;
let pollTimer = null;

function showLogin(msg) {
  if (msg) {
    document.getElementById("loginError").textContent = msg;
    document.getElementById("loginError").style.display = "block";
  }
  modal.classList.add("open");
}
function hideLogin() { modal.classList.remove("open"); }

async function requireAdmin() {
  if (!getToken()) { showLogin(); return false; }
  try {
    const me = await api("/auth/me");
    if (me.data?.role !== "admin") {
      clearSession();
      showLogin("Admin account required.");
      return false;
    }
    setSession(getToken(), me.data, "user");
    hideLogin();
    return true;
  } catch {
    clearSession();
    showLogin("Session expired.");
    return false;
  }
}

document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        email: document.getElementById("adminEmail").value.trim(),
        password: document.getElementById("adminPassword").value,
      },
    });
    if (data.data?.role !== "admin") throw new Error("Not an admin");
    setSession(data.token, data.data, "user");
    hideLogin();
    boot();
  } catch (err) {
    document.getElementById("loginError").textContent = err.message || "Login failed";
    document.getElementById("loginError").style.display = "block";
  }
});

function fmtTime(d) {
  try {
    return new Date(d).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
}

async function loadInbox() {
  const json = await api("/support/inbox");
  const list = json.data || [];
  const el = document.getElementById("inboxItems");
  if (!list.length) {
    el.innerHTML = `<div style="padding:2rem;text-align:center;color:#6b5e52">No retailers yet.</div>`;
    return;
  }
  el.innerHTML = list.map((t) => {
    const r = t.retailer;
    const id = r.id || r._id;
    const preview = t.lastMessage?.message || "No messages yet";
    const unread = t.unread ? `<span class="badge_unread">${t.unread}</span>` : "";
    return `<div class="inbox_item ${activeRetailerId === String(id) ? "active" : ""}" data-id="${id}" data-name="${r.businessName || ""}">
      <img src="${avatarUrl(r.businessName, r.logo)}" alt="" />
      <div class="inbox_meta">
        <div class="inbox_name">${r.businessName || "Retailer"} ${unread}</div>
        <div class="inbox_preview">${preview}</div>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll(".inbox_item").forEach((item) => {
    item.addEventListener("click", () => openThread(item.dataset.id, item.dataset.name));
  });
}

async function openThread(id, name) {
  activeRetailerId = String(id);
  document.getElementById("threadTitle").textContent = name || "Retailer";
  document.getElementById("composeForm").style.display = "flex";
  await loadMessages();
  loadInbox();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 5000);
}

async function loadMessages() {
  if (!activeRetailerId) return;
  const json = await api(`/support?retailerId=${encodeURIComponent(activeRetailerId)}`);
  const msgs = json.data || [];
  const box = document.getElementById("threadMessages");
  if (!msgs.length) {
    box.innerHTML = `<div class="empty_thread">No messages yet. Say hello to this retailer.</div>`;
    return;
  }
  box.innerHTML = msgs.map((m) => {
    const mine = m.senderType === "admin";
    return `<div class="bubble ${mine ? "mine" : "theirs"}">${escapeHtml(m.message)}<time>${fmtTime(m.createdAt)}</time></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c]));
}

document.getElementById("composeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("composeInput");
  const text = input.value.trim();
  if (!text || !activeRetailerId) return;
  input.value = "";
  try {
    await api("/support", { method: "POST", body: { retailerId: activeRetailerId, message: text } });
    await loadMessages();
    await loadInbox();
  } catch (err) {
    alert(err.message || "Send failed");
  }
});

document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  if (!confirm("Log out?")) return;
  try { await api("/auth/logout", { method: "POST" }); } catch {}
  clearSession();
  location.reload();
});

async function boot() {
  const ok = await requireAdmin();
  if (!ok) return;
  await loadInbox();
}

boot();
</script>
</body>
</html>
