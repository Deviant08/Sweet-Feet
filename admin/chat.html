<!doctype html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="/CSS/icons.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/assets/20251102_172020.png"
      sizes="32x32"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/retailer.css" />
    <title>Support Chat — Sweet Feet Admin</title>
    <style>
      body::-webkit-scrollbar {
        display: none;
      }
      .chat_layout {
        display: flex;
        min-height: 100vh;
        background: #faf7f2;
      }
      .chat_inbox {
        width: 320px;
        border-right: 1px solid #e8e0d6;
        background: #fff;
        overflow-y: auto;
        flex-shrink: 0;
      }
      .inbox_item {
        display: flex;
        gap: 0.75rem;
        padding: 1rem 1.1rem;
        cursor: pointer;
        border-bottom: 1px solid #f0ebe3;
      }
      .inbox_item:hover,
      .inbox_item.active {
        background: #f5efe6;
      }
      .inbox_item img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }
      .inbox_meta {
        flex: 1;
        min-width: 0;
      }
      .inbox_name {
        font-weight: 700;
        font-size: 1.15rem;
      }
      .inbox_preview {
        font-size: 1.05rem;
        color: #6b5e52;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat_thread {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .thread_header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #e8e0d6;
        background: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
      }
      .thread_messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .bubble {
        max-width: 75%;
        padding: 0.75rem 1rem;
        border-radius: 14px;
        font-size: 1.15rem;
        line-height: 1.45;
      }
      .bubble.mine {
        align-self: flex-end;
        background: #160c02;
        color: #f7dfb8;
      }
      .bubble.theirs {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #e8e0d6;
        color: #160c02;
      }
      .bubble time {
        display: block;
        font-size: 0.85rem;
        opacity: 0.7;
        margin-top: 0.35rem;
      }
      .thread_compose {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
        border-top: 1px solid #e8e0d6;
        background: #fff;
      }
      .thread_compose input {
        flex: 1;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        border: 1px solid #e8e0d6;
        font: inherit;
      }
      .thread_compose button {
        padding: 0.85rem 1.2rem;
        border: none;
        border-radius: 10px;
        background: #160c02;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .empty_thread {
        margin: auto;
        color: #6b5e52;
        text-align: center;
        padding: 2rem;
      }
      .status_dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .status_dot.approved {
        background: #166534;
      }
      .status_dot.pending {
        background: #b45309;
      }
      .status_dot.declined,
      .status_dot.suspended {
        background: #c0392b;
      }
      .chat_back {
        display: none;
        align-items: center;
        justify-content: center;
        width: 2.4rem;
        height: 2.4rem;
        border: none;
        border-radius: 50%;
        background: #f3ede8;
        color: #160c02;
        font-size: 1.25rem;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
        margin-right: 0.5rem;
        line-height: 1;
        padding: 0;
      }
      @media (max-width: 860px) {
        .chat_layout {
          flex-direction: column;
          min-height: calc(100dvh - 6rem);
          height: calc(100dvh - 6rem);
          position: relative;
          overflow: hidden;
        }
        .chat_inbox {
          width: 100%;
          height: 100%;
          max-height: none;
          border-right: 0;
          border-bottom: 0;
          display: flex;
          flex-direction: column;
        }
        .chat_thread {
          display: none;
          flex-direction: column;
          height: 100%;
          min-height: 0;
          width: 100%;
        }
        .chat_layout.thread-open .chat_inbox {
          display: none !important;
        }
        .chat_layout.thread-open .chat_thread {
          display: flex !important;
        }
        .chat_back { display: inline-flex; }
        .bubble { max-width: 88%; }
        .thread_compose { flex-wrap: wrap; }
        .thread_compose button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="dashboard_wrap">
      <nav class="sidebar_nav">
        <a class="sidebar_logo" href="/index.html">
          <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
          <span>Sweet Feet</span>
        </a>
        <span class="sidebar_label">Admin</span>
        <a class="sidebar_link" href="/admin/dashboard.html"
          ><span class="icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg></span> Overview</a
        >
        <a class="sidebar_link" href="/admin/retailers.html"
          ><span class="icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z"/></svg></span> Retailers</a
        >
        <a class="sidebar_link" href="/admin/products.html"
          ><span class="icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg></span> Official Shop</a
        >
        <a class="sidebar_link active" href="/admin/chat.html"
          ><span class="icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg></span> Support Chat</a
        >
        <div class="sidebar_divider"></div>
        <a class="sidebar_link" id="logoutBtn" href="/nav/login.html?role=admin"
          ><span class="icon"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg></span> Log Out</a
        >
      </nav>

      <div class="main_content" style="padding: 0">
        <div class="chat_layout">
          <div class="chat_inbox" id="inboxList">
            <div
              style="
                padding: 1rem 1.1rem;
                font-weight: 800;
                border-bottom: 1px solid #e8e0d6;
              "
            >
              Retailers
            </div>
            <div id="inboxItems">
              <div style="padding: 2rem; text-align: center; color: #6b5e52">
                Loading…
              </div>
            </div>
          </div>
          <div class="chat_thread">
            <div class="thread_header">
              <button type="button" class="chat_back" id="chatBackBtn" aria-label="Back to retailers">←</button>
              <span id="threadTitle">Select a retailer</span>
            </div>
            <div class="thread_messages" id="threadMessages">
              <div class="empty_thread">
                Choose a retailer on the left to start chatting.
              </div>
            </div>
            <form class="thread_compose" id="composeForm" style="display: none">
              <input
                id="composeInput"
                type="text"
                placeholder="Message retailer…"
                autocomplete="off"
                required
              />
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        api,
        setSession,
        clearSession,
        getToken,
        avatarUrl,
        sfAlert,
        confirmAndLogout,
      } from "/js/api.js";

      let activeRetailerId = null;
      let pollTimer = null;

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = String(s == null ? "" : s);
        return d.innerHTML;
      }

      async function requireAdmin() {
        if (!getToken()) {
          window.location.replace("/nav/login.html?role=admin");
          return false;
        }
        try {
          const me = await api("/auth/me");
          if (me.data?.role !== "admin") {
            clearSession();
            window.location.replace("/nav/login.html?role=admin");
            return false;
          }
          setSession(getToken(), me.data, "user");
          return true;
        } catch {
          clearSession();
          window.location.replace("/nav/login.html?role=admin");
          return false;
        }
      }

      function fmtTime(d) {
        try {
          return new Date(d).toLocaleString("en-GB", {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return "";
        }
      }

      async function fetchPartners() {
        const tries = [
          "/messages/staff/partners",
          "/retailers/admin/all",
          "/retailers",
        ];
        let lastErr = null;
        for (const path of tries) {
          try {
            const json = await api(path);
            const list = Array.isArray(json.data) ? json.data : [];
            if (list.length || path === "/retailers") return list;
          } catch (err) {
            lastErr = err;
          }
        }
        if (lastErr) throw lastErr;
        return [];
      }

      async function loadInbox() {
        const el = document.getElementById("inboxItems");
        try {
          const list = await fetchPartners();
          if (!list.length) {
            el.innerHTML =
              '<div style="padding:2rem;text-align:center;color:#6b5e52">No retailers yet.</div>';
            return;
          }
          el.innerHTML = list
            .map((r) => {
              const id = r._id || r.id;
              const name = r.businessName || "Retailer";
              const status = r.status || "";
              return (
                '<div class="inbox_item' +
                (activeRetailerId === String(id) ? " active" : "") +
                '" data-id="' +
                escapeHtml(id) +
                '" data-name="' +
                escapeHtml(name) +
                '">' +
                '<img src="' +
                avatarUrl(name, r.logo) +
                '" alt="" />' +
                '<div class="inbox_meta">' +
                '<div class="inbox_name">' +
                escapeHtml(name) +
                "</div>" +
                '<div class="inbox_preview"><span class="status_dot ' +
                escapeHtml(status) +
                '"></span>' +
                escapeHtml(status) +
                (r.email ? " · " + escapeHtml(r.email) : "") +
                "</div>" +
                "</div></div>"
              );
            })
            .join("");

          el.querySelectorAll(".inbox_item").forEach((item) => {
            item.addEventListener("click", () =>
              openThread(item.dataset.id, item.dataset.name),
            );
          });
        } catch (err) {
          el.innerHTML =
            '<div style="padding:2rem;color:#6b5e52">' +
            escapeHtml(err.message || "Failed to load") +
            "</div>";
        }
      }

      async function openThread(id, name) {
        activeRetailerId = String(id);
        document.getElementById("threadTitle").textContent = name || "Retailer";
        document.getElementById("composeForm").style.display = "flex";
        document.querySelectorAll(".inbox_item").forEach((el) => {
          el.classList.toggle("active", el.dataset.id === String(id));
        });
        document.querySelector(".chat_layout")?.classList.add("thread-open");
        await loadMessages();
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(loadMessages, 4000);
      }

      function closeThreadView() {
        document.querySelector(".chat_layout")?.classList.remove("thread-open");
        activeRetailerId = null;
        document.getElementById("threadTitle").textContent = "Select a retailer";
        document.getElementById("composeForm").style.display = "none";
        document.getElementById("threadMessages").innerHTML =
          '<div class="empty_thread">Choose a retailer on the left to start chatting.</div>';
        document.querySelectorAll(".inbox_item").forEach((el) => el.classList.remove("active"));
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function loadMessages() {
        if (!activeRetailerId) return;
        const box = document.getElementById("threadMessages");
        try {
          const json = await api(
            "/messages?threadType=staff&retailerId=" +
              encodeURIComponent(activeRetailerId),
          );
          const msgs = json.data || [];
          if (!msgs.length) {
            box.innerHTML =
              '<div class="empty_thread">No messages yet. Say hello to this retailer.</div>';
            return;
          }
          box.innerHTML = msgs
            .map((m) => {
              const mine = m.senderType === "admin";
              return (
                '<div class="bubble ' +
                (mine ? "mine" : "theirs") +
                '">' +
                escapeHtml(m.message) +
                "<time>" +
                fmtTime(m.createdAt) +
                "</time></div>"
              );
            })
            .join("");
          box.scrollTop = box.scrollHeight;
        } catch (err) {
          box.innerHTML =
            '<div class="empty_thread">' +
            escapeHtml(err.message || "Could not load") +
            "</div>";
        }
      }

      document
        .getElementById("composeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const input = document.getElementById("composeInput");
          const text = input.value.trim();
          if (!text || !activeRetailerId) return;
          input.value = "";
          try {
            await api("/messages", {
              method: "POST",
              body: {
                threadType: "staff",
                retailerId: activeRetailerId,
                message: text,
              },
            });
            await loadMessages();
          } catch (err) {
            await sfAlert(err.message || "Send failed");
          }
        });

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async (e) => {
          e.preventDefault();
          await confirmAndLogout("/nav/login.html?role=admin");
        });

      document.getElementById("chatBackBtn")?.addEventListener("click", (e) => {
        e.preventDefault();
        closeThreadView();
      });

      async function boot() {
        const ok = await requireAdmin();
        if (!ok) return;
        await loadInbox();
        const q = new URLSearchParams(window.location.search).get("retailer");
        if (q) {
          const item = document.querySelector(
            '.inbox_item[data-id="' + q + '"]',
          );
          if (item) openThread(item.dataset.id, item.dataset.name);
        }
      }

      boot();
    </script>
  <script src="/js/dash-nav.js" defer></script>
</body>
