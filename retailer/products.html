<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <title>My Products — Sweet Feet Retailer</title>
</head>
<body>

<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Main</span>
    <a class="sidebar_link" href="/retailer/dashboard.html"><span class="icon">📊</span> Dashboard</a>
    <a class="sidebar_link active" href="/retailer/products.html"><span class="icon">👟</span> My Products</a>
    <a class="sidebar_link" href="/retailer/orders.html"><span class="icon">📦</span> Orders</a>
    <a class="sidebar_link" href="/retailer/chat.html"><span class="icon">💬</span> Messages</a>
    <div class="sidebar_divider"></div>
    <span class="sidebar_label">Account</span>
    <a class="sidebar_link" href="/index.html" target="_blank"><span class="icon">🌐</span> View Store</a>
    <a class="sidebar_link" href="#" id="logoutBtn"><span class="icon">🚪</span> Log Out</a>
  </nav>

  <div class="main_content">
    <div class="page_header">
      <div>
        <h1>My Products</h1>
        <p>Manage your shoe listings. Add, edit, or remove products from your store.</p>
      </div>
      <div class="header_actions">
        <button class="btn_sm dark" id="addProductBtn">+ Add Product</button>
      </div>
    </div>

    <div class="page_body">
      <div class="product_manage_grid" id="productGrid">
        <div class="empty_state">
          <div class="empty_icon">⏳</div>
          <p>Loading your products…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal_overlay" id="productModal">
  <div class="modal">
    <h3 id="modalTitle">Add New Product</h3>
    <input type="hidden" id="editProductId" value="" />
    <div class="form_group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Pro Grip Trainers" required />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div class="form_group">
        <label>Category</label>
        <select id="pCategory">
          <option value="trainers">Trainers</option>
          <option value="casual">Casual</option>
          <option value="corporate">Corporate</option>
          <option value="loafers">Loafers</option>
          <option value="runners">Runners</option>
          <option value="sandals">Sandals</option>
          <option value="boots">Boots</option>
        </select>
      </div>
      <div class="form_group">
        <label>Gender</label>
        <select id="pGender">
          <option value="unisex">Unisex</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div class="form_group">
        <label>Price (₦)</label>
        <input type="number" id="pPrice" placeholder="e.g. 12000" min="0" step="0.01" required />
      </div>
      <div class="form_group">
        <label>Old Price (₦) — optional</label>
        <input type="number" id="pOldPrice" placeholder="e.g. 15000" min="0" step="0.01" />
      </div>
    </div>
    <div class="form_group">
      <label>Colour</label>
      <select id="pColor">
        <option value="black">Black</option>
        <option value="white">White</option>
        <option value="brown">Brown</option>
        <option value="multi">Multi</option>
      </select>
    </div>
    <div class="form_group">
      <label>Available Sizes (comma separated)</label>
      <input type="text" id="pSizes" placeholder="e.g. 39,40,41,42,43" required />
    </div>
    <div class="form_group">
      <label>Product Image URL</label>
      <input type="url" id="pImg" placeholder="https://example.com/shoe.jpg" required />
    </div>
    <div class="msg_error" id="modalError"></div>
    <div class="modal_footer">
      <button class="btn_sm outline" id="modalCancelBtn">Cancel</button>
      <button class="btn_sm dark" id="modalSaveBtn">Save Product</button>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
