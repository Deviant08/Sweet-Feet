<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <title>Retailer Login — Sweet Feet</title>
</head>
<body>
<div class="auth_wrap">
  <div class="auth_panel_left">
    <a class="auth_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <h2 class="auth_headline">Welcome<br /><span>back.</span></h2>
    <p class="auth_sub">Log in to your retailer dashboard to manage your listings, respond to customers, and track your orders.</p>
  </div>
  <div class="auth_panel_right">
    <div class="auth_card">
      <h2>Retailer Login</h2>
      <p class="auth_card_sub">Enter your approved retailer credentials to continue.</p>
      <div class="msg_error" id="msgError"></div>
      <form id="retailerLoginForm">
        <div class="form_group">
          <label for="email">Business Email</label>
          <input id="email" type="email" placeholder="e.g. info@lagoskicks.com" required />
        </div>
        <div class="form_group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn_primary" id="submitBtn">Log In →</button>
      </form>
      <p class="auth_footer_link">Not a retailer yet? <a href="/retailer/signup.html">Register here</a></p>
      <p class="auth_footer_link" style="margin-top:.8rem">Are you a customer? <a href="/nav/login.html">Customer login</a></p>
    </div>
  </div>
</div>
<script>
const form = document.getElementById('retailerLoginForm');
const errorEl = document.getElementById('msgError');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';
  submitBtn.textContent = 'Logging in…';
  submitBtn.disabled = true;

  try {
    const res  = await fetch('/sweetfeet/api/retailer_login.php', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('sf_retailer_id',   data.retailer_id);
      localStorage.setItem('sf_retailer_name', data.business_name);
      window.location.href = '/retailer/dashboard.html';
    } else {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
      submitBtn.textContent = 'Log In →';
      submitBtn.disabled = false;
    }
  } catch {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    submitBtn.textContent = 'Log In →';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
