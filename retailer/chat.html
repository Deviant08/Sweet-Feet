<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <link rel="stylesheet" href="/CSS/chat.css" />
  <title>Messages — Sweet Feet</title>
  <style>
    /* Customer nav bar */
    .cust_nav {
      background: #160c02;
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 6.4rem;
      flex-shrink: 0;
    }
    .cust_logo {
      display: flex; align-items: center; gap: 1rem;
      text-decoration: none; color: #f7dfb8;
    }
    .cust_logo img { width: 3.8rem; height: 3.8rem; border-radius: 50%; object-fit: cover; }
    .cust_logo span { font-family: var(--ff-display); font-size: 1.8rem; font-weight: 700; }
    .cust_nav_links { display: flex; gap: 2rem; align-items: center; }
    .cust_nav_links a {
      text-decoration: none; color: #ece3bd;
      font-size: 1.3rem; font-weight: 600;
      transition: color .2s;
    }
    .cust_nav_links a:hover { color: #efbc8a; }
    .cust_nav_links a.active { color: #efbc8a; }

    /* Full height layout below nav */
    body { display: flex; flex-direction: column; }
    .chat_outer {
      flex: 1;
      display: flex;
      overflow: hidden;
      height: calc(100vh - 6.4rem);
    }
    .chat_layout { height: 100%; }
  </style>
</head>
<body>

<!-- Customer nav -->
<div class="cust_nav">
  <a class="cust_logo" href="/index.html">
    <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
    <span>Sweet Feet</span>
  </a>
  <div class="cust_nav_links">
    <a href="/nav/products.html">Shop</a>
    <a href="/nav/track.html">Track Order</a>
    <a href="/nav/chat.html" class="active">Messages</a>
    <a href="/nav/feedback.html">Feedback</a>
  </div>
</div>

<div class="chat_outer">
  <div class="chat_layout" style="width:100%">

    <!-- Inbox list -->
    <div class="chat_inbox" id="inboxList">
      <div class="inbox_search">
        <input type="text" id="inboxSearch" placeholder="Search retailers…" />
      </div>
      <div id="inboxItems">
        <div style="padding:2rem;text-align:center;color:var(--clr-muted)">Loading…</div>
      </div>
    </div>

    <!-- Conversation panel -->
    <div class="chat_panel" id="chatPanel">
      <div class="chat_empty_state" id="chatEmptyState">
        <div style="font-size:3rem;margin-bottom:1rem">💬</div>
        <p>Select a conversation from the left</p>
        <small style="margin-top:.5rem;font-size:1.2rem">
          or <a href="/nav/products.html" style="color:var(--clr-accent);font-weight:700">browse the shop</a> and click "Chat with Retailer" on any product.
        </small>
      </div>

      <div class="chat_header hidden" id="chatHeader">
        <div class="chat_avatar" id="chatAvatar"></div>
        <div>
          <div class="chat_partner_name" id="chatPartnerName"></div>
          <div class="chat_partner_sub"  id="chatPartnerSub"></div>
        </div>
      </div>

      <div class="chat_messages hidden" id="chatMessages"></div>

      <div class="chat_input_bar hidden" id="chatInputBar">
        <textarea id="chatInput" placeholder="Type a message…" rows="1"></textarea>
        <button id="chatSendBtn">Send</button>
      </div>
    </div>

  </div>
</div>

<script>
// Auth guard — customer must be logged in
const customerName = localStorage.getItem('sf_user_name') || localStorage.getItem('sf_user_email');
if (!localStorage.getItem('sf_user_id')) {
  window.location.href = '/nav/login.html?next=/nav/chat.html';
}

let activeRetailerId = null;
let activeRetailerName = '';
let lastMessageId    = null;
let pollInterval     = null;
let allConversations = [];

// ── Check if opened with a retailer pre-selected (from product page) ──
const urlParams    = new URLSearchParams(window.location.search);
const preRetailerId   = parseInt(urlParams.get('retailer_id'))   || null;
const preRetailerName = urlParams.get('retailer_name') || '';
const preProductId    = parseInt(urlParams.get('product_id'))    || null;

// ── Load inbox ─────────────────────────────────────────────
async function loadInbox() {
  try {
    const res = await fetch('/sweetfeet/api/messages.php?inbox=1');
    allConversations = await res.json();
    renderInbox(allConversations);

    // Auto-open pre-selected retailer (e.g. coming from product page)
    if (preRetailerId && !activeRetailerId) {
      openConversation(preRetailerId, preRetailerName || 'Retailer');
    }
  } catch { console.error('Could not load inbox.'); }
}

function renderInbox(convs) {
  const el = document.getElementById('inboxItems');
  if (!convs.length) {
    el.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--clr-muted);font-size:1.3rem">No conversations yet.<br><br><a href="/sweetfeet/nav/products.html" style="color:var(--clr-accent);font-weight:700">Browse the shop →</a></div>';
    return;
  }
  el.innerHTML = convs.map(c => `
    <div class="inbox_item ${activeRetailerId===c.retailer_id?'active':''}"
         onclick="openConversation(${c.retailer_id},'${(c.retailer_name||'Retailer').replace(/'/g,"\\'")}')">
      <div class="inbox_avatar">${(c.retailer_name||'R').charAt(0).toUpperCase()}</div>
      <div class="inbox_info">
        <div class="inbox_name">${c.retailer_name||'Retailer'}</div>
        <div class="inbox_preview">${c.last_message||''}</div>
      </div>
      ${parseInt(c.unread_count)>0 ? `<span class="inbox_unread">${c.unread_count}</span>` : ''}
    </div>`).join('');
}

// ── Search inbox ───────────────────────────────────────────
document.getElementById('inboxSearch').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderInbox(allConversations.filter(c => (c.retailer_name||'').toLowerCase().includes(q)));
});

// ── Open conversation ──────────────────────────────────────
async function openConversation(retailerId, retailerName) {
  activeRetailerId   = retailerId;
  activeRetailerName = retailerName;
  lastMessageId      = null;
  clearInterval(pollInterval);

  document.getElementById('chatEmptyState').classList.add('hidden');
  document.getElementById('chatHeader').classList.remove('hidden');
  document.getElementById('chatMessages').classList.remove('hidden');
  document.getElementById('chatInputBar').classList.remove('hidden');
  document.getElementById('chatAvatar').textContent      = retailerName.charAt(0).toUpperCase();
  document.getElementById('chatPartnerName').textContent = retailerName;
  document.getElementById('chatPartnerSub').textContent  = 'Retailer · Sweet Feet';
  document.getElementById('chatMessages').innerHTML      = '';

  renderInbox(allConversations);
  await fetchMessages();
  pollInterval = setInterval(fetchMessages, 4000);
}

// ── Fetch messages ─────────────────────────────────────────
async function fetchMessages() {
  if (!activeRetailerId) return;
  try {
    let url = `/sweetfeet/api/messages.php?retailer_id=${activeRetailerId}`;
    if (preProductId && lastMessageId === null) url += `&product_id=${preProductId}`;

    const res  = await fetch(url);
    const msgs = await res.json();
    if (!msgs.length) return;

    const latest = msgs[msgs.length - 1];
    if (latest.id === lastMessageId) return;
    lastMessageId = latest.id;

    const container = document.getElementById('chatMessages');
    container.innerHTML = msgs.map(m => `
      <div class="msg_row ${m.sender_type==='customer'?'msg_mine':'msg_theirs'}">
        <div class="msg_bubble">${escHtml(m.message)}</div>
        <div class="msg_time">${fmtTime(m.created_at)}</div>
      </div>`).join('');
    container.scrollTop = container.scrollHeight;
    loadInbox();
  } catch { console.error('Poll failed.'); }
}

// ── Send message ───────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text || !activeRetailerId) return;
  input.value    = '';
  input.disabled = true;

  const payload = { retailer_id: activeRetailerId, message: text };
  if (preProductId && lastMessageId === null) payload.product_id = preProductId;

  try {
    const res  = await fetch('/sweetfeet/api/messages.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) await fetchMessages();
    else alert(data.error);
  } catch { alert('Could not send message.'); }

  input.disabled = false;
  input.focus();
}

document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function fmtTime(d) { return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadInbox();
</script>
</body>
</html>
