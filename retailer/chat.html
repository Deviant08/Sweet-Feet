<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <link rel="stylesheet" href="/CSS/chat.css" />
  <title>Messages — Sweet Feet Retailer</title>
  <style>.hidden { display: none !important; }</style>
</head>
<body>

<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Main</span>
    <a class="sidebar_link" href="/retailer/dashboard.html"><span class="icon">📊</span> Dashboard</a>
    <a class="sidebar_link" href="/retailer/products.html"><span class="icon">👟</span> My Products</a>
    <a class="sidebar_link" href="/retailer/orders.html"><span class="icon">📦</span> Orders</a>
    <a class="sidebar_link active" href="/retailer/chat.html"><span class="icon">💬</span> Messages</a>
    <div class="sidebar_divider"></div>
    <a class="sidebar_link" href="#" id="logoutBtn"><span class="icon">🚪</span> Log Out</a>
  </nav>

  <div class="main_content" style="padding:0">
    <div class="chat_layout" style="height:100vh;width:100%">
      <div class="chat_inbox" id="inboxList">
        <div class="inbox_search">
          <input type="text" id="inboxSearch" placeholder="Search customers…" />
        </div>
        <div id="inboxItems">
          <div style="padding:2rem;text-align:center;color:var(--clr-muted)">Loading…</div>
        </div>
      </div>

      <div class="chat_panel" id="chatPanel">
        <div class="chat_empty_state" id="chatEmptyState">
          <div style="font-size:3rem;margin-bottom:1rem">💬</div>
          <p>Select a conversation</p>
        </div>
        <div class="chat_header hidden" id="chatHeader">
          <div class="chat_avatar" id="chatAvatar"></div>
          <div>
            <div class="chat_partner_name" id="chatPartnerName"></div>
            <div class="chat_partner_sub" id="chatPartnerSub"></div>
          </div>
        </div>
        <div class="chat_messages hidden" id="chatMessages"></div>
        <div class="chat_input_bar hidden" id="chatInputBar">
          <textarea id="chatInput" placeholder="Type a message…" rows="1"></textarea>
          <button id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
