<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/20251102_172020.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&family=Work+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/retailer.css" />
  <title>Retailer Dashboard — Sweet Feet</title>
</head>
<body>

<div class="dashboard_wrap">
  <nav class="sidebar_nav">
    <a class="sidebar_logo" href="/index.html">
      <img src="/assets/images (7).jpeg" alt="Sweet Feet" />
      <span>Sweet Feet</span>
    </a>
    <span class="sidebar_label">Retailer</span>
    <a class="sidebar_link active" href="/retailer/dashboard.html"><span class="icon">📊</span> Overview</a>
    <a class="sidebar_link" href="/retailer/products.html"><span class="icon">👟</span> Products</a>
    <a class="sidebar_link" href="/retailer/orders.html"><span class="icon">📦</span> Orders</a>
    <a class="sidebar_link" href="/retailer/chat.html"><span class="icon">💬</span> Messages</a>
    <div class="sidebar_divider"></div>
    <a class="sidebar_link" href="/index.html" target="_blank"><span class="icon">🌐</span> View Site</a>
    <a class="sidebar_link" href="#" id="logoutBtn"><span class="icon">🚪</span> Log Out</a>
  </nav>

  <div class="main_content">
    <div class="page_header">
      <div>
        <h1 id="welcomeHeading">Welcome back</h1>
        <p>Your store at a glance.</p>
      </div>
    </div>

    <div class="page_body">
      <div id="statusBanner" style="display:none"></div>

      <div class="stats_grid">
        <div class="stat_card"><div class="stat_icon">📦</div><div class="stat_value" id="statOrders">—</div><div class="stat_label">Orders</div></div>
        <div class="stat_card"><div class="stat_icon">⏳</div><div class="stat_value" id="statPending">—</div><div class="stat_label">Pending</div></div>
        <div class="stat_card"><div class="stat_icon">👟</div><div class="stat_value" id="statProducts">—</div><div class="stat_label">Products</div></div>
        <div class="stat_card"><div class="stat_icon">💬</div><div class="stat_value" id="statMessages">—</div><div class="stat_label">Messages</div></div>
      </div>

      <div class="table_wrap">
        <div class="table_header"><h3>Recent Orders</h3></div>
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recentOrdersBody">
            <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--clr-muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { getRetailer } from "/js/api.js";

  const banner = document.getElementById("statusBanner");
  const status = (getRetailer()?.status || "").toLowerCase();
  if (banner) {
    if (status === "pending") {
      banner.style.cssText =
        "display:block;padding:1.25rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;background:#fff6e5;border:1px solid #e8c47a;font-size:1.2rem;line-height:1.5;";
      banner.innerHTML =
        "<strong>⏳ Pending approval.</strong> An admin still needs to approve your store. You cannot list products until then. Log out and log back in after they decide to refresh your status.";
    } else if (status === "declined") {
      banner.style.cssText =
        "display:block;padding:1.25rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;background:#fdecea;border:1px solid #e8a0a0;font-size:1.2rem;line-height:1.5;";
      banner.innerHTML =
        "<strong>❌ Application declined.</strong> An admin declined your retailer application. Contact support if you believe this was a mistake.";
    } else if (status === "suspended") {
      banner.style.cssText =
        "display:block;padding:1.25rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;background:#fdecea;border:1px solid #e8a0a0;font-size:1.2rem;line-height:1.5;";
      banner.innerHTML =
        "<strong>🚫 Account suspended.</strong> Your store is suspended. Contact support for help.";
    } else if (status === "approved") {
      banner.style.cssText =
        "display:block;padding:1.25rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;background:#e8f7ee;border:1px solid #8fd4a8;font-size:1.2rem;line-height:1.5;";
      banner.innerHTML =
        "<strong>✅ Approved.</strong> Your store is live. You can list products and receive orders.";
    }
  }
</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
